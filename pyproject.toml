[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vaccine-vaers-lot-safety-engine"
version = "2.0.0"
description = "VaccineLot-Sentinel: CDC / FDA VAERS Lot Clustering & Safety Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
vaccine-vaers-lot-safety-engine = "vaccine_lot_safety.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/vaccine-vaers-lot-safety-engine"
Repository = "https://github.com/abusuraihsakhri/vaccine-vaers-lot-safety-engine.git"
