version: '3.8'

services:
  vaccine-vaers-lot-safety-engine:
    build: .
    container_name: vaccine-vaers-lot-safety-engine
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=vaccine-vaers-lot-safety-engine-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
