name: Tests and basic security checks
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[api,dev]"
      - name: Dependency consistency
        run: python -m pip check
      - name: Compile Python modules
        run: python -m compileall -q agents vaccine_lot_safety vaers_lots.py cli.py
      - name: Run Python regression tests
        run: python -m pytest -q
      - name: Verify audit chain
        run: python -c "from agents.base import AuditLogger; assert AuditLogger.verify_integrity()"
      - name: Test browser CSV module
        run: node --test tests/test_web_lots.cjs
      - name: Validate browser JavaScript syntax
        run: node --check web/app.js && node --check web/lot_analysis.js
